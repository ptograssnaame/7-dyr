<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Система продаж</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#0E0F13;--surface:#16181E;--line:#262932;--fg:#F2F2F0;--muted:#A9ABB3;--accent:#7CF29C;--accent-ink:#0E0F13;--warn:#FFD66B;--bad:#FF9C8C;
--display:'Unbounded','Golos Text',system-ui,sans-serif;--body:'Golos Text',system-ui,-apple-system,'Segoe UI',sans-serif;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:17px;line-height:1.55;
background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:40px 40px}
#app{max-width:720px;margin:0 auto;padding-block:28px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:56px}
h1,h2,h3,h4{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(28px,7.5vw,44px);line-height:1.08;font-weight:800}
h2{font-size:clamp(22px,5.4vw,30px);line-height:1.15;font-weight:800}
h3{font-size:18px;line-height:1.3;font-weight:600;margin-top:10px}
h4{font-size:15px;font-weight:600}
p{margin:0}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.muted{color:var(--muted)}.acc{color:var(--accent)}a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:6px}
.hero{display:flex;flex-direction:column;gap:16px}
.progress{display:flex;align-items:center;gap:12px;font-weight:600;font-size:15px}
.pbar{flex:1;height:8px;border-radius:8px;background:var(--line);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.toc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toc a{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg);text-decoration:none;font-size:15px;min-width:0}
.toc a b{flex:none;font-family:var(--display);color:var(--accent-ink);background:var(--accent);border-radius:7px;width:26px;height:26px;display:grid;place-items:center;font-size:13px}
.toc a.ok{border-color:var(--accent)}
@media (max-width:480px){.toc{grid-template-columns:1fr}}
.step{display:flex;flex-direction:column;gap:14px;scroll-margin-top:16px}
.num{font-family:var(--display);font-weight:800;font-size:13px;color:var(--accent-ink);background:var(--accent);border-radius:8px;padding:3px 9px;align-self:flex-start}
.lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
ul.fix{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
ul.fix li{position:relative;padding-left:22px}
ul.fix li::before{content:'';position:absolute;left:2px;top:.62em;width:9px;height:9px;border-radius:50%;background:var(--accent)}
ol.flow,ol.blocks{margin:0;padding:0;list-style:none;counter-reset:f;display:flex;flex-direction:column;gap:10px}
ol.flow li,ol.blocks li{counter-increment:f;display:grid;grid-template-columns:34px 1fr;column-gap:12px;align-items:start}
ol.flow li::before,ol.blocks li::before{content:counter(f);grid-row:span 2;font-family:var(--display);font-weight:800;font-size:14px;color:var(--accent-ink);background:var(--accent);border-radius:9px;height:30px;display:grid;place-items:center}
ol.flow li span{color:var(--muted);font-size:15px}
.task{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.tpl{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;padding-top:46px}
.tpl pre{margin:0;white-space:pre-wrap;word-break:break-word;font:15px/1.55 var(--body)}
.cp{position:absolute;top:10px;right:10px;font:600 13px var(--body);background:var(--accent);color:var(--accent-ink);border:0;border-radius:9px;padding:6px 12px;cursor:pointer}
.table{overflow-x:auto;border:1px solid var(--line);border-radius:16px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface)}
tr:last-child td{border-bottom:0}
td input{width:80px;font:600 16px var(--body);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
td.weak{color:var(--bad);font-weight:700}
.note{font-size:15px;color:var(--muted)}
.warnbox{border-left:3px solid var(--warn);padding:6px 0 6px 14px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.cards>div{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px;font-size:15px}
@media (max-width:620px){.cards{grid-template-columns:1fr}}
.formula{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.formula span{background:var(--surface);border:1px solid var(--accent);border-radius:10px;padding:6px 12px;font-weight:600}
.formula i{font-style:normal;color:var(--accent);font-weight:800}
.checklist{display:flex;flex-direction:column}
.checklist label,.done{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.checklist label{padding:10px 0;border-bottom:1px solid var(--line)}
.done{background:var(--surface);border:1px dashed var(--accent);border-radius:14px;padding:14px 16px;font-weight:600}
input[type=checkbox]{appearance:none;flex:none;width:24px;height:24px;margin:0;border:2px solid var(--muted);border-radius:7px;display:grid;place-items:center;cursor:pointer}
input[type=checkbox]:checked{background:var(--accent);border-color:var(--accent)}
input[type=checkbox]:checked::after{content:'';width:6px;height:11px;border:solid var(--accent-ink);border-width:0 3px 3px 0;transform:rotate(45deg) translate(-1px,-1px)}
.score{font-family:var(--display);font-weight:800;font-size:22px;color:var(--accent)}
.kw{font-weight:800;background:var(--accent);color:var(--accent-ink);padding:1px 10px;border-radius:8px}
.final{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px}
.lock{min-height:70vh;display:flex;flex-direction:column;justify-content:center;gap:16px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}html{scroll-behavior:auto}}
</style>
</head>

<main id="app">
  <div class="lock" id="lock">
    <span class="eyebrow">Система продаж</span>

</main>

const IV = "EIkXd83sfXInrx84";
function b64(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';return Uint8Array.from(atob(s),c=>c.charCodeAt(0));}
async function open(){
  const m = location.hash.match(/k=([A-Za-z0-9_-]+)/);
  if(!m) return;
  try{
    const key = await crypto.subtle.importKey('raw', b64(m[1]), 'AES-GCM', false, ['decrypt']);
    const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(IV)}, key, b64(DATA));
    const html = await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    document.getElementById('app').innerHTML = html;
    init();
  }catch(e){
    document.getElementById('lockmsg').textContent = 'Ссылка неполная или с ошибкой. Скопируй её из сообщения целиком, вместе с частью после знака #. Если не получается — напиши мне в Direct.';
  }
}
function store(k,v){try{if(v===undefined)return JSON.parse(localStorage.getItem(k)||'null');localStorage.setItem(k,JSON.stringify(v));}catch(e){return null;}}
function init(){
  const steps=[...document.querySelectorAll('[data-step]')];
  const saved=store('sistema.steps')||[];
  const toc=[...document.querySelectorAll('.toc a')];
  const upd=()=>{const st=steps.map(b=>b.checked);store('sistema.steps',st);
    const n=st.filter(Boolean).length-(st[0]?1:0);
    document.getElementById('pfill').style.width=(n/8*100)+'%';
    document.getElementById('ptext').textContent=n+' из 8 шагов';
    toc.forEach((a,i)=>a.classList.toggle('ok',!!st[i]));};
  steps.forEach((b,i)=>{b.checked=!!saved[i];b.addEventListener('change',upd);});upd();

  const fin=[...document.querySelectorAll('#final input')];
  const fs=store('sistema.final')||[];
  const fu=()=>{const st=fin.map(b=>b.checked);store('sistema.final',st);document.getElementById('fscore').textContent=st.filter(Boolean).length+' / '+fin.length;};
  fin.forEach((b,i)=>{b.checked=!!fs[i];b.addEventListener('change',fu);});fu();

  document.querySelectorAll('.cp').forEach(btn=>btn.addEventListener('click',async()=>{
    const t=btn.parentElement.querySelector('pre').innerText;
    try{await navigator.clipboard.writeText(t);btn.textContent='Скопировано';}
    catch(e){const r=document.createRange();r.selectNodeContents(btn.parentElement.querySelector('pre'));const s=getSelection();s.removeAllRanges();s.addRange(r);btn.textContent='Выделено — скопируй';}
    setTimeout(()=>btn.textContent='Скопировать',1800);}));

  const ins=[...document.querySelectorAll('#calc input')];
  const cs=store('sistema.calc')||[];
  const cu=()=>{const v=ins.map(i=>parseFloat(i.value.replace(',','.')));store('sistema.calc',ins.map(i=>i.value));
    let worst=-1,wv=Infinity;
    for(let i=1;i<4;i++){const td=document.querySelector('[data-o="'+i+'"]');td.classList.remove('weak');
      if(v[i-1]>0&&!isNaN(v[i])){const p=v[i]/v[i-1]*100;td.textContent=Math.round(p)+'%';if(p<wv){wv=p;worst=i;}}else td.textContent='—';}
    const w=document.getElementById('weak');
    const names=['','Слово → открыли подарок','Подарок → страница продукта','Страница → покупка'];
    if(worst>0){document.querySelector('[data-o="'+worst+'"]').classList.add('weak');w.textContent='Самый слабый переход: '+names[worst]+'. Чини на этой неделе только его — подсказки в таблице ниже.';}
    else w.textContent='Впиши числа за неделю — подсвечу самый слабый переход.';};
  ins.forEach((i,k)=>{i.value=cs[k]||'';i.addEventListener('input',cu);});cu();
}
open();
</script>
